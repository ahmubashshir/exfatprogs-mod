name: release

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string

permissions:
  id-token: write
  contents: write
  pages: write

jobs:
  on-tag:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0
        submodules: true
        ref: refs/tags/${{ inputs.tag }}

    - uses: nttld/setup-ndk@v1
      with:
        ndk-version: r27

    - name: build
      run: |
        REPO="${{ github.repository }}"
        make libs

        make module.prop
        echo "updateJson=https://${REPO%/*}.github.io/${REPO#*/}/update.json" >> module.prop

        make exfatprogs.zip
        REPO="https://github.com/$REPO" sh update.json.sh

    - name: release
      uses: softprops/action-gh-release@v3
      with:
        files: exfatprogs.zip
        tag_name: ${{ inputs.tag }}

    - name: push(release-meta)
      uses: actions/upload-pages-artifact@v5
      with:
        name: github-pages
        path: ./public
        retention-days: 1

    - name: deploy(site)
      uses: actions/deploy-pages@v5
